<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mr. Fukuyama — Talent Scoreboard</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        background: #050805;
        color: #9cff9c;
        font-family: "Courier New", monospace;
        padding: clamp(20px, 4vw, 48px);
        max-width: 900px;
        margin: auto;
      }
      h1 { text-transform: uppercase; font-size: clamp(20px, 3vw, 32px); margin: 0 0 28px; }

      .act-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid #111;
        font-size: 18px;
        transition: color 0.2s;
      }
      .act-row.active { color: #9cfff9; }

      .act-num {
        font-size: 12px;
        color: #4a8a4a;
        width: 28px;
        flex-shrink: 0;
      }
      .act-title { flex: 1; font-weight: bold; }
      .act-performer { font-size: 14px; opacity: 0.5; margin-top: 2px; }

      .act-score {
        font-size: 32px;
        font-weight: bold;
        min-width: 90px;
        text-align: right;
        color: #ff9cfc;
      }
      .act-score.zero { color: #333; font-size: 20px; }

      .bar-wrap {
        width: 160px;
        height: 8px;
        background: #111;
        flex-shrink: 0;
      }
      .bar {
        height: 100%;
        background: #ff9cfc;
        transition: width 0.4s ease;
      }
      .act-row.active .bar { background: #9cfff9; }

      #announce-btn {
        margin-top: 36px;
        background: #ff9cfc;
        color: #050805;
        border: none;
        padding: 18px 48px;
        font-size: 20px;
        font-weight: bold;
        font-family: inherit;
        cursor: pointer;
        display: none;
      }
      #announce-btn:disabled { opacity: 0.35; cursor: not-allowed; }

      #announcement {
        margin-top: 24px;
        border: 1px solid #ff9cfc;
        color: #ff9cfc;
        padding: 24px;
        font-size: 22px;
        white-space: pre-wrap;
        display: none;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Showcase Scoreboard</h1>
    <div id="scoreboard"></div>
    <button id="announce-btn" onclick="announceWinner()">ANNOUNCE WINNER</button>
    <div id="announcement"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const ACTS = [
        { id: 1, num: "01", title: "Flaming-o Laser Show",                               performer: "Jenna",  desc: "Jenna is dressed as a flamingo and performs a crazy EDM dance with laser pointers synced to flamingo visuals." },
        { id: 2, num: "02", title: "Resolving Workplace Conflict with Mixed Martial Arts", performer: "Aubri",  desc: "Aubri is a black belt and demos actual karate moves as a metaphor for resolving workplace conflict." },
        { id: 3, num: "03", title: "Chairholder Cha Cha",                                performer: "Jo",     desc: "Jo leads a full jazzercise routine — the Cupid Shuffle — performed entirely seated in an office chair." },
        { id: 4, num: "04", title: "Strategic Asset Reallocation",                        performer: "Sarah",  desc: "Sarah gives a corporate presentation detailing all the things she has strategically reallocated from bars over the years." },
        { id: 5, num: "05", title: "This Shit Is Bananas",                                performer: "",       desc: "Someone in a full banana costume does a stupid dance." },
        { id: 6, num: "06", title: "DJ Dry Phonics",                                      performer: "Pat",    desc: "Pat DJs an original full production set featuring 90s internet modem sounds, You've Got Mail reggae beats, and other internet nostalgia. It's a whole thing." },
      ];

      const socket = io();
      let state = { currentAct: null, scoring: false, scores: {} };

      socket.on("talent-state", (s) => { state = s; render(); });
      socket.on("score-update", ({ scores }) => { state.scores = scores; render(); });

      function render() {
        const maxScore = Math.max(1, ...ACTS.map((a) => state.scores[a.id] || 0));
        const board = document.getElementById("scoreboard");
        board.innerHTML = "";

        ACTS.forEach((a) => {
          const score = state.scores[a.id] || 0;
          const isActive = state.scoring && state.currentAct === a.id;
          const pct = Math.round((score / maxScore) * 100);

          const row = document.createElement("div");
          row.className = "act-row" + (isActive ? " active" : "");
          row.innerHTML = `
            <span class="act-num">${a.num}</span>
            <div style="flex:1">
              <div class="act-title">${a.title}</div>
              ${a.performer ? `<div class="act-performer">${a.performer}</div>` : ""}
            </div>
            <div class="bar-wrap"><div class="bar" style="width:${score ? pct : 0}%"></div></div>
            <div class="act-score ${score === 0 ? "zero" : ""}">${score === 0 ? "—" : score + " ❤️"}</div>
          `;
          board.appendChild(row);
        });

        const anyScored = Object.values(state.scores).some((v) => v > 0);
        document.getElementById("announce-btn").style.display =
          !state.scoring && anyScored ? "inline-block" : "none";
      }

      async function announceWinner() {
        const btn = document.getElementById("announce-btn");
        btn.textContent = "DELIBERATING...";
        btn.disabled = true;

        const scored = ACTS
          .filter((a) => state.scores[a.id] != null)
          .map((a) => ({ ...a, score: state.scores[a.id] || 0 }))
          .sort((a, b) => b.score - a.score);

        const res = await fetch("/api/announce-talent-winner", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ winner: scored[0], runnerUps: scored.slice(1) }),
        });
        const data = await res.json();

        btn.textContent = "ANNOUNCE WINNER";
        btn.disabled = false;

        const box = document.getElementById("announcement");
        box.style.display = "block";
        box.textContent = data.announcement || data.error;

        if (data.audio) new Audio("data:audio/mp3;base64," + data.audio).play();
      }

      render();
    </script>
  </body>
</html>
