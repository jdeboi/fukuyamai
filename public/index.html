<!doctype html>
<html>
  <head>
    <title>Mr. Fukuyama Neural Interface</title>
    <style>
      body {
        background: #050805;
        color: #9cff9c;
        font-family: "Courier New", monospace;
        padding: 40px;
      }

      h1 {
        font-size: 36px;
        text-transform: uppercase;
      }

      textarea {
        width: 100%;
        height: 100px;
        background: #111;
        color: #9cff9c;
        border: 1px solid #9cff9c;
        font-family: inherit;
        font-size: 18px;
        padding: 12px;
      }

      button {
        margin-top: 16px;
        background: #9cff9c;
        color: #050805;
        border: none;
        padding: 14px 22px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
      }

      #answer {
        margin-top: 30px;
        border: 1px solid #9cff9c;
        padding: 20px;
        min-height: 120px;
        font-size: 22px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>MR. FUKUYAMA NEURAL INTERFACE v0.9</h1>

    <p>Enter question for executive jar consciousness:</p>

    <textarea id="question">What is your guidance for the next CEO?</textarea>
    <br />
    <button onclick="askJar()">TRANSMIT TO JAR</button>

    <div id="answer">Awaiting neural moisture...</div>

    <script>
      async function askJar() {
        const question = document.getElementById("question").value;
        const answerBox = document.getElementById("answer");

        answerBox.textContent =
          "PROCESSING... RECALIBRATING EXECUTIVE FLUIDS...";

        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const data = await res.json();

        if (data.error) {
          answerBox.textContent = data.error;
          return;
        }

        answerBox.textContent = data.answer;

        const audio = new Audio("data:audio/mp3;base64," + data.audio);
        audio.play();
      }
    </script>
  </body>
</html>
