<!doctype html>
<html>
  <head>
    <title>Mr. Fukuyama Host Console</title>
    <style>
      body {
        background: #050805;
        color: #9cff9c;
        font-family: "Courier New", monospace;
        padding: 40px;
      }

      h1 {
        text-transform: uppercase;
      }

      button {
        background: #9cff9c;
        color: #050805;
        border: none;
        padding: 16px 24px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
      }

      .box {
        border: 1px solid #9cff9c;
        padding: 20px;
        margin-top: 24px;
        font-size: 22px;
        white-space: pre-wrap;
      }

      #count {
        font-size: 32px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Mr. Fukuyama Host Console</h1>

    <p>Queued questions:</p>
    <div id="count">0</div>

    <button onclick="answerNext()">ANSWER NEXT QUESTION</button>

    <div class="box">
      <strong>Question:</strong>
      <div id="question">Awaiting queue activity...</div>
    </div>

    <div class="box">
      <strong>Answer:</strong>
      <div id="answer">The jar is moist and ready.</div>
    </div>

    <script>
      async function updateCount() {
        const res = await fetch("/api/queue-count");
        const data = await res.json();
        document.getElementById("count").textContent = data.count;
      }

      async function answerNext() {
        const questionBox = document.getElementById("question");
        const answerBox = document.getElementById("answer");

        questionBox.textContent = "Retrieving next question...";
        answerBox.textContent =
          "PROCESSING... RECALIBRATING EXECUTIVE FLUIDS...";

        const res = await fetch("/api/answer-next", {
          method: "POST",
        });

        const data = await res.json();

        if (data.error) {
          answerBox.textContent = data.error;
          return;
        }

        document.getElementById("count").textContent = data.count;
        questionBox.textContent = data.question || "No question.";
        answerBox.textContent = data.answer;

        if (data.audio) {
          const audio = new Audio("data:audio/mp3;base64," + data.audio);
          audio.play();
        }
      }

      updateCount();
      setInterval(updateCount, 3000);
    </script>
  </body>
</html>
