<!doctype html>
<html>
  <head>
    <title>Ask Mr. Fukuyama</title>
    <style>
      body {
        background: #050805;
        color: #9cff9c;
        font-family: "Courier New", monospace;
        padding: 40px;
        max-width: 700px;
        margin: auto;
      }

      h1 {
        text-transform: uppercase;
      }

      textarea {
        width: 100%;
        height: 140px;
        background: #111;
        color: #9cff9c;
        border: 1px solid #9cff9c;
        font-family: inherit;
        font-size: 20px;
        padding: 12px;
      }

      button {
        margin-top: 16px;
        background: #9cff9c;
        color: #050805;
        border: none;
        padding: 14px 22px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
      }

      #status {
        margin-top: 24px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Ask Mr. Fukuyama</h1>
    <p>Submit one question to the executive jar consciousness.</p>

    <textarea
      id="question"
      placeholder="What should the next CEO know?"
    ></textarea>
    <br />
    <button onclick="submitQuestion()">SUBMIT TO JAR QUEUE</button>

    <div id="status"></div>

    <script>
      async function submitQuestion() {
        const question = document.getElementById("question").value;
        const status = document.getElementById("status");

        status.textContent = "Submitting to jar queue...";

        const res = await fetch("/api/submit-question", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const data = await res.json();

        if (data.error) {
          status.textContent = data.error;
          return;
        }

        document.getElementById("question").value = "";
        status.textContent = `Question submitted. Current queue: ${data.count}`;
      }
    </script>
  </body>
</html>
